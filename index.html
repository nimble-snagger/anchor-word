<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Anchor Word</title>
<style>
  :root {
    --paper: #f7f4ec;
    --paper-line: #d9d3c1;
    --ink: #1f2937;
    --graphite: #4b5563;
    --graphite-soft: #6b7280;
    --anchor-gold: #b08a3e;
    --anchor-gold-fill: rgba(176, 138, 62, 0.14);
    --tally-pos: #5c7a5c;
    --tally-neg: #9c4a3c;
    --tally-neg-fill: rgba(156, 74, 60, 0.08);
    --cell-size: 26px;
    --focus: #2f6fb0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 10px 16px 6px;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--ink);
  }

  #versionTag {
    font-size: 11px;
    font-weight: 400;
    color: var(--graphite-soft);
    vertical-align: middle;
  }

  header .subtitle {
    font-size: 12px;
    color: var(--graphite-soft);
  }

  #scoreSummary {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--graphite);
    display: flex;
    gap: 14px;
  }
  #scoreSummary .pos { color: var(--tally-pos); }
  #scoreSummary .neg { color: var(--tally-neg); }

  #boardWrap {
    flex: 1;
    min-height: 0;
    display: flex;
    padding: 0 8px;
  }

  #boardScroll {
    flex: 1;
    overflow: auto;
    border: 1px solid var(--paper-line);
    background: #fffdf8;
    position: relative;
    touch-action: pan-x pan-y;
  }

  #gridSvgHost {
    position: relative;
  }

  .cellText {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    fill: var(--ink);
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .gridLine { stroke: var(--paper-line); stroke-width: 1; }
  .marginDivider { stroke: var(--ink); stroke-width: 1.5; }

  .anchorCellRect { fill: var(--anchor-gold-fill); }
  .anchorBoundary { stroke: var(--anchor-gold); stroke-width: 2; fill: none; }

  .tallyCellBox { fill: none; stroke: var(--paper-line); stroke-width: 1; }
  .tallyMark { stroke: var(--graphite); stroke-width: 1.6; }
  .tallyMarkNeg { stroke: var(--tally-neg); stroke-width: 1.6; }

  .ghostCell { fill: rgba(47, 111, 176, 0.16); }
  .ghostCellBad { fill: rgba(156, 74, 60, 0.18); }
  .ghostText { fill: var(--focus); font-family: 'Space Mono', monospace; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  .matchHighlight { fill: rgba(176, 138, 62, 0.35); }

  .pickTarget { cursor: pointer; }

  .cornerPlaceRect {
    fill: #ece7d9;
    stroke: var(--paper-line);
    stroke-width: 1;
  }
  .cornerPlaceRect.cornerPlaceReady {
    fill: var(--ink);
    stroke: var(--ink);
  }
  .cornerPlaceText {
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 700;
    fill: var(--graphite-soft);
    letter-spacing: 0.03em;
    pointer-events: none;
  }
  .cornerPlaceText.cornerPlaceReady {
    fill: #fff;
  }

  .coordLabelText {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    fill: var(--graphite-soft);
    text-anchor: middle;
    dominant-baseline: baseline;
    pointer-events: none;
  }
  .coordLabelRow {
    text-anchor: end;
    dominant-baseline: central;
  }

  #tray {
    flex-shrink: 0;
    border-top: 1px solid var(--paper-line);
    padding: 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #candidateRow {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #candidateLabel {
    font-size: 11px;
    text-transform: none;
    color: var(--graphite-soft);
    letter-spacing: 0.02em;
  }

  #candidateWord {
    display: flex;
    gap: 4px;
  }

  .candLetter {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 20px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    cursor: pointer;
    color: var(--ink);
  }

  .candLetter.selected {
    background: var(--anchor-gold);
    color: #fff;
    border-color: var(--anchor-gold);
  }

  .candLetter.disabled {
    cursor: default;
  }

  #statusLine {
    font-size: 13px;
    min-height: 18px;
    color: var(--graphite);
  }
  #statusLine.error { color: var(--tally-neg); }
  #statusLine.ok { color: var(--tally-pos); }

  #controlsRow {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 4px;
    border: 1.5px solid var(--ink);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.35; cursor: default; }

  button.primary {
    background: var(--ink);
    color: #fff;
  }

  button.danger {
    border-color: var(--tally-neg);
    color: var(--tally-neg);
  }

  button.rotate {
    font-family: 'Space Mono', monospace;
    width: 40px;
    padding: 9px 0;
    text-align: center;
  }

  #dirLabel {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--graphite);
    min-width: 34px;
    text-align: center;
  }

  #overlayScreen {
    position: fixed;
    inset: 0;
    background: rgba(31, 41, 55, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  #overlayScreen.hidden { display: none; }

  .modal {
    background: var(--paper);
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    padding: 24px;
    max-width: 380px;
    width: 90%;
  }
  .modal h2 {
    font-family: 'Space Mono', monospace;
    margin: 0 0 10px;
    font-size: 20px;
  }
  .modal p { font-size: 14px; line-height: 1.5; color: var(--graphite); }
  .modal .modalActions { display: flex; gap: 10px; margin-top: 16px; }

  #newGameBtn {
    font-size: 12px;
    padding: 6px 12px;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--paper-line); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Anchor Word <span id="versionTag">v0.4</span></h1>
      <div class="subtitle">Build outward from the anchor</div>
    </div>
    <div id="scoreSummary">
      <span class="pos" id="posScoreLabel">+0</span>
      <span class="neg" id="negScoreLabel">−0</span>
    </div>
    <button id="newGameBtn">New game</button>
  </header>

  <div id="boardWrap">
    <div id="boardScroll">
      <div id="gridSvgHost"></div>
    </div>
  </div>

  <div id="tray">
    <div id="candidateRow">
      <span id="candidateLabel">Current word</span>
      <div id="candidateWord"></div>
    </div>
    <div id="statusLine"></div>
    <div id="controlsRow">
      <button class="rotate" id="rotateCCW" title="Rotate anticlockwise">↺</button>
      <span id="dirLabel">E</span>
      <button class="rotate" id="rotateCW" title="Rotate clockwise">↻</button>
      <button id="flipBtn" title="Reverse letter order">Flip</button>
      <button id="undoBtn" title="Undo last move" disabled>Undo</button>
      <button id="redoBtn" title="Redo" disabled>Redo</button>
      <div style="flex:1"></div>
      <button class="danger" id="discardBtn">Discard (−1)</button>
      <button class="primary" id="placeBtn" disabled>Place word</button>
    </div>
  </div>
</div>

<div id="overlayScreen" class="hidden">
  <div class="modal" id="modalContent"></div>
</div>

<script src="wordlist.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
